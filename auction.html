<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>法拍案件優扣房屋稅額表</title>
  <style>
    :root {
      --primary: #b3f051;
      --primary-dark: #98d042;
      --primary-light: #d4f8a0;
      --bg: #f0f4f8;
      --text: #2d3436;
      --text-light: #636e72;
      --white: #ffffff;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --radius: 12px;
      --border: #dfe6e9;
    }

    * {
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    body {
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background: var(--white);
      width: 100%;
      max-width: 1000px;
      padding: 50px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    /* Decorative Background SVG */
    .bg-decoration {
      position: absolute;
      top: -100px;
      right: -100px;
      z-index: 0;
      opacity: 0.05;
      pointer-events: none;
    }

    header {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 3px solid var(--primary);
    }

    h1 {
      margin: 0;
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #2d3436;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-left: 5px solid var(--primary);
      padding-left: 15px;
    }

    section {
      position: relative;
      z-index: 1;
      margin-bottom: 40px;
      padding: 20px;
      background: #fdfdfd;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .field-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .field-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-light);
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--white);
      outline: none;
    }

    input[type="text"]:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-light);
    }

    /* Table Design */
    .table-container {
      overflow-x: auto;
      margin-top: 15px;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    th {
      background: #f8f9fa;
      color: var(--text-light);
      font-weight: 600;
      padding: 15px;
      text-align: center;
      border-bottom: 2px solid var(--border);
    }

    td {
      padding: 12px 15px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tbody tr:hover {
      background-color: #f9fff0;
    }

    .text-right {
      text-align: right;
    }

    .total-row {
      background-color: #2d3436 !important;
      color: var(--primary);
      font-weight: 700;
    }

    .total-row td {
      border-bottom: none;
      padding: 18px 15px;
    }

    /* Buttons */
    .btn-area {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      font-size: 0.95rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    button:active {
      transform: translateY(1px);
    }

    .btn-add {
      background: var(--primary);
      color: #1a1a1a;
    }

    .btn-add:hover {
      background: var(--primary-dark);
    }

    .btn-print {
      background: #2d3436;
      color: var(--white);
    }

    .btn-print:hover {
      background: #000;
    }

    .btn-reset {
      background: #ecf0f1;
      color: var(--text-light);
    }

    .btn-reset:hover {
      background: #dfe6e9;
    }

    .btn-delete {
      background: #ffeaa7;
      color: #d63031;
      padding: 6px 12px;
      font-size: 0.85rem;
    }

    .btn-delete:hover {
      background: #fab1a0;
      color: #fff;
    }

    /* Custom Checkbox */
    .checklist {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 15px;
      background: #f8f9fa;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .check-item:hover {
      background: #f0f7ff;
    }

    .check-item.active {
      background: var(--primary-light);
      border-color: var(--primary);
    }

    .box {
      width: 22px;
      height: 22px;
      border: 2px solid #ccc;
      border-radius: 4px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .check-item.active .box {
      background: var(--primary);
      border-color: var(--primary);
    }

    .check-item.active .box::after {
      content: '';
      width: 6px;
      height: 12px;
      border: solid #1a1a1a;
      border-width: 0 3px 3px 0;
      transform: rotate(45deg);
      margin-bottom: 2px;
    }

    /* Signature Area */
    .signature-area {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 30px;
      margin-top: 60px;
      text-align: center;
    }

    .sig-item label {
      display: block;
      margin-bottom: 40px;
      font-size: 1.1rem;
      color: #2d3436;
    }

    .sig-underline {
      border-bottom: 2px solid #2d3436;
      height: 30px;
    }

    .copyright {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-light);
      margin-top: 60px;
      opacity: 0.6;
    }

    /* Utilities */
    .full-width {
      width: 100%;
      border: none !important;
      background: transparent !important;
      text-align: inherit;
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .container {
        box-shadow: none;
        border: none;
        padding: 20px;
        max-width: 100%;
      }

      .no-print,
      .bg-decoration,
      .btn-area {
        display: none !important;
      }

      section {
        border: 1px solid #eee;
        margin-bottom: 20px;
      }

      .total-row {
        background: #eee !important;
        color: #000 !important;
      }

      input,
      select {
        border: none !important;
        padding: 0 !important;
      }

      .check-item {
        background: transparent !important;
        border: none !important;
        padding: 5px 0 !important;
      }

      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>
</head>

<body>

  <svg class="bg-decoration" width="400" height="400" viewBox="0 0 400 400" fill="none"
    xmlns="http://www.w3.org/2000/svg">
    <path d="M200 0L373.205 100V300L200 400L26.7949 300V100L200 0Z" fill="url(#paint0_linear)" />
    <defs>
      <linearGradient id="paint0_linear" x1="200" y1="0" x2="200" y2="400" gradientUnits="userSpaceOnUse">
        <stop stop-color="#b3f051" />
        <stop offset="1" stop-color="#b3f051" stop-opacity="0" />
      </linearGradient>
    </defs>
  </svg>

  <div class="container">
    <header>
      <h1>
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        法拍案件優扣房屋稅額表
      </h1>
    </header>

    <section>
      <div class="section-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        房屋稅籍資料
      </div>
      <div class="field-row" style="margin-bottom: 20px;">
        <label>拍賣標的</label>
        <input type="text" class="nav-input" placeholder="房屋坐落">
      </div>
      <div class="field-group">
        <div class="field-row">
          <label>稅籍編號</label>
          <input type="text" id="taxIdInput" class="nav-input" placeholder="00-00-0000-000" oninput="handleTaxId(this)" maxlength="14">
        </div>
        <div class="field-row">
          <label>納稅義務人</label>
          <input type="text" class="nav-input" placeholder="房屋所有人">
        </div>
      </div>
    </section>

    <section>
      <div class="section-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="1" x2="12" y2="23"></line>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </svg>
        應優先扣繳稅額
      </div>

      <div class="btn-area no-print">
        <div style="display:flex; align-items:center; gap:10px;">
          <label>年度：</label>
          <input type="text" id="yearInput" style="width: 100px;" class="nav-input" placeholder="例如 113">
        </div>
        <button class="btn-add" onclick="addRow()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          新增項目
        </button>
        <button class="btn-print" onclick="window.print()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 6 2 18 2 18 9"></polyline>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
            <rect x="6" y="14" width="12" height="8"></rect>
          </svg>
          列印報表
        </button>
        <button class="btn-reset" onclick="confirmReset()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          重整清空
        </button>
      </div>

      <div class="table-container">
        <table id="taxTable">
          <thead>
            <tr>
              <th style="width: 100px">年度</th>
              <th>本稅 (元)</th>
              <th>滯納金 (元)</th>
              <th>合計 (元)</th>
              <th style="width: 180px">備註</th>
              <th class="no-print" style="width: 80px">操作</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
          <tfoot>
            <tr class="total-row">
              <td>總計</td>
              <td id="grandTax" class="text-right">0</td>
              <td id="grandPenalty" class="text-right">0</td>
              <td id="grandTotal" class="text-right">0</td>
              <td></td>
              <td class="no-print"></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </section>

    <section>
      <div class="section-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
        檢附文件清單
      </div>
      <div class="checklist">
        <div class="check-item" onclick="toggleCheck(this)">
          <div class="box"></div>
          拍賣案件管制作業建檔
        </div>
        <div class="check-item" onclick="toggleCheck(this)">
          <div class="box"></div>
          優先扣繳函或權利移轉證書
        </div>
        <div class="check-item" onclick="toggleCheck(this)">
          <div class="box"></div>
          稅籍紀錄表
        </div>
        <div class="check-item" onclick="toggleCheck(this)">
          <div class="box"></div>
          欠稅查詢表
        </div>
        <div class="check-item" onclick="toggleCheck(this)">
          <div class="box"></div>
          其他相關證明文件
        </div>
      </div>
    </section>

    <div class="signature-area">
      <div class="sig-item">
        <label>承辦人</label>
        <div class="sig-underline"></div>
      </div>
      <div class="sig-item">
        <label>股長</label>
        <div class="sig-underline"></div>
      </div>
      <div class="sig-item">
        <label>審核員</label>
        <div class="sig-underline"></div>
      </div>
      <div class="sig-item">
        <label>科長</label>
        <div class="sig-underline"></div>
      </div>
    </div>

    <div class="copyright">&copy; 2026 Don Huang. All rights reserved. | 專業稅務計算系統</div>
  </div>

  <script>
    function formatNumber(num) {
      return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    function parseNumber(str) {
      if (!str) return 0;
      return parseFloat(str.toString().replace(/,/g, "")) || 0;
    }

    function confirmReset() {
      if (confirm("您確定要重整頁面嗎？所有已輸入的資料將會被清空。")) {
        location.reload();
      }
    }

    function toggleCheck(el) {
      el.classList.toggle('active');
    }

    // Enter key navigation
    document.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        const inputs = Array.from(
          document.querySelectorAll(
            ".nav-input, #tableBody input, #tableBody select",
          ),
        );
        const index = inputs.indexOf(document.activeElement);
        if (index > -1 && index < inputs.length - 1) {
          e.preventDefault();
          inputs[index + 1].focus();
        }
      }
    });

    function addRow() {
      const yearInput = document.getElementById("yearInput");
      if (yearInput.value.trim() === "") return alert("請輸入年度");

      const tbody = document.getElementById("tableBody");
      const row = document.createElement("tr");

      const remarkSelect = `
      <select class="full-width">
          <option value=""></option>
          <option value="未送達">未送達</option>
          <option value="已取證未移送">已取證未移送</option>
          <option value="移送執行">移送執行</option>
          <option value="債權憑證">債權憑證</option>
      </select>`;

      row.innerHTML = `
      <td style="text-align:center; font-weight:bold;">${yearInput.value}</td>
      <td><input type="text" class="full-width text-right" value="0" onblur="handleFormat(this)" onfocus="handleUnformat(this)"></td>
      <td><input type="text" class="full-width text-right" value="0" onblur="handleFormat(this)" onfocus="handleUnformat(this)"></td>
      <td class="row-total text-right" style="font-weight:600;">0</td>
      <td>${remarkSelect}</td>
      <td class="no-print" style="text-align:center;">
        <button class="btn-delete" onclick="deleteRow(this)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></button>
        </button>
      </td>
    `;

      tbody.appendChild(row);
      yearInput.value = "";
      row.querySelectorAll("input")[0].focus();
      updateGrandTotal();
    }

    function deleteRow(btn) {
      if (confirm("確定要刪除此列資料嗎？")) {
        const row = btn.closest("tr");
        row.remove();
        updateGrandTotal();
      }
    }

    function handleFormat(input) {
      let val = parseNumber(input.value);
      input.value = formatNumber(val);
      calculateRow(input);
    }

    function handleUnformat(input) {
      input.value = parseNumber(input.value);
      input.select();
    }

    function calculateRow(input) {
      const row = input.closest("tr");
      const inputs = row.querySelectorAll("input");
      const tax = parseNumber(inputs[0].value);
      const penalty = parseNumber(inputs[1].value);
      const total = tax + penalty;
      row.querySelector(".row-total").innerText = formatNumber(total);
      updateGrandTotal();
    }

    function handleTaxId(input) {
      let val = input.value.replace(/\D/g, ""); // 只保留數字
      let formatted = "";
      
      if (val.length > 0) formatted += val.substring(0, 2);
      if (val.length > 2) formatted += "-" + val.substring(2, 4);
      if (val.length > 4) formatted += "-" + val.substring(4, 8);
      if (val.length > 8) formatted += "-" + val.substring(8, 11);
      
      input.value = formatted;
    }

    function updateGrandTotal() {
      let totalTax = 0,
        totalPenalty = 0,
        totalAll = 0;
      document.querySelectorAll("#tableBody tr").forEach((row) => {
        const inputs = row.querySelectorAll("input");
        if (inputs.length >= 2) {
          totalTax += parseNumber(inputs[0].value);
          totalPenalty += parseNumber(inputs[1].value);
          totalAll += parseNumber(row.querySelector(".row-total").innerText);
        }
      });
      document.getElementById("grandTax").innerText = formatNumber(totalTax);
      document.getElementById("grandPenalty").innerText = formatNumber(totalPenalty);
      document.getElementById("grandTotal").innerText = formatNumber(totalAll);
    }
  </script>

</body>

</html>
